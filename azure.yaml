name: tdd-erp-crm-odoo-mcp-demo
metadata:
  template: tdd-erp-crm-odoo-mcp-demo@0.1.0

infra:
  provider: bicep
  layers:
    - name: credentials
      path: infra/bootstrap
      module: main
      hooks:
        preprovision:
          - windows:
              shell: pwsh
              run: ../../scripts/preprovision.ps1
              interactive: true
            posix:
              shell: sh
              run: sh ../../scripts/preprovision.sh
              interactive: true
    - name: application
      path: infra
      module: main
      dependsOn:
        - credentials

# ACI is provisioned entirely through IaC. `azd up` and `azd provision` create
# the sandbox; post hooks print its endpoints and disposable demo credentials.
hooks:
  postprovision:
    - windows:
        shell: pwsh
        run: ./scripts/postdelivery.ps1
        interactive: true
      posix:
        shell: sh
        run: sh ./scripts/postdelivery.sh
        interactive: true
  postdeploy:
    - windows:
        shell: pwsh
        run: ./scripts/postdelivery.ps1
        interactive: true
      posix:
        shell: sh
        run: sh ./scripts/postdelivery.sh
        interactive: true
