name: azd-erp-crm-odoo-mcp-demo
metadata:
  template: azd-erp-crm-odoo-mcp-demo@0.1.0

infra:
  provider: bicep
  path: infra
  module: main

# ACI is provisioned entirely through IaC. `azd up` and `azd provision` create
# the sandbox; post hooks print its endpoints and disposable demo credentials.
hooks:
  preprovision:
    - windows:
        shell: pwsh
        run: ./scripts/preprovision.ps1
        interactive: true
      posix:
        shell: sh
        run: sh ./scripts/preprovision.sh
        interactive: true
  postprovision:
    - windows:
        shell: pwsh
        run: ./scripts/postdelivery.ps1
        interactive: true
      posix:
        shell: sh
        run: sh ./scripts/postdelivery.sh
        interactive: true
  postdeploy:
    - windows:
        shell: pwsh
        run: ./scripts/postdelivery.ps1
        interactive: true
      posix:
        shell: sh
        run: sh ./scripts/postdelivery.sh
        interactive: true
